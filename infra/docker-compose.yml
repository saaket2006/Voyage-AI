services:
  mysql:
    image: mysql:8.0
    container_name: voyage_ai_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-voyage}
      MYSQL_USER: ${MYSQL_USER:-voyage_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-voyage_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-voyage_root_password}
    ports:
      # Host port 3307 mapped to container 3306 to avoid host MySQL service collision on 3306
      - "${DOCKER_MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init-voyage.sql:ro
    networks:
      - voyage-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD:-voyage_root_password} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: voyage_ai_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8081}:8081"
    env_file:
      - ../.env
    volumes:
      - ../.env:/app/.env:ro
    environment:
      SERVER_PORT: 8081
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-voyage}
      MYSQL_USER: ${MYSQL_USER:-voyage_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-voyage_dev_password}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      JWT_SECRET: ${JWT_SECRET:-voyageai_dev_secret_key_placeholder_not_for_production_min_256_bits_required!}
    networks:
      - voyage-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/api/v1/health | grep 'UP' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  mysql_data:
    name: voyage_ai_mysql_data

networks:
  voyage-network:
    name: voyage_ai_network
    driver: bridge
