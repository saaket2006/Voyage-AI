# Voyage-AI Centralized Test Suite Configuration
# Local development base URLs
frontend.base.url=http://localhost:5173
backend.base.url=http://localhost:8081/api/v1
backend.actuator.url=http://localhost:8081/actuator

# Playwright Browser Options
playwright.headless=true
playwright.browser=chromium
playwright.slowMo=0
playwright.timeout=30000

# Traces & Screenshots on failure
playwright.record.traces=true
playwright.record.screenshots=true
