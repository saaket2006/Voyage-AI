server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: voyage-ai-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:voyage}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Open-Meteo Weather Integration
open-meteo:
  base-url: ${OPEN_METEO_BASE_URL:https://api.open-meteo.com/v1}
  connect-timeout-ms: 3000
  read-timeout-ms: 5000

# JWT Configuration Placeholder (Implementation in Phase 2)
jwt:
  secret: ${JWT_SECRET:voyageai_dev_secret_key_placeholder_not_for_production_min_256_bits_required!}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# Gemini API Configuration (Google AI Studio)
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
  connect-timeout-ms: ${GEMINI_CONNECT_TIMEOUT_MS:5000}
  read-timeout-ms: ${GEMINI_READ_TIMEOUT_MS:15000}

# Destination Ingestion & Provider Configuration
app:
  destinations:
    import:
      enabled: ${APP_DESTINATIONS_IMPORT_ENABLED:false}
    wikimedia:
      base-url: ${WIKIMEDIA_BASE_URL:https://en.wikipedia.org/api/rest_v1}
      user-agent: ${WIKIMEDIA_USER_AGENT:VoyageAI/1.0 (academic-travel-planner; contact@voyageai.local)}
      connect-timeout-ms: ${WIKIMEDIA_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${WIKIMEDIA_READ_TIMEOUT_MS:10000}

