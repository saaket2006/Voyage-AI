server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: voyage-ai-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:voyage_ai}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:voyage_user}
    password: ${MYSQL_PASSWORD:voyage_dev_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# JWT Configuration Placeholder (Implementation in Phase 2)
jwt:
  secret: ${JWT_SECRET:voyageai_dev_secret_key_placeholder_not_for_production_min_256_bits_required!}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
